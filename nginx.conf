# ============================================================================
# NGINX REVERSE PROXY & STATIC ASSETS SERVER
# Enrutamiento: Frontend Vainilla (estáticos) + Reverse Proxy hacia Spring Boot
# ============================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para optimizar First Contentful Paint móvil
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    # Entrega de archivos estáticos del frontend vainilla (HTML, CSS, JS)
    location / {
        try_files $uri $uri/ /index.html;
        # El documento de entrada nunca se sirve desde caché sin revalidar: si no,
        # un deploy deja al usuario con el index viejo y los módulos viejos.
        add_header Cache-Control "no-cache" always;
    }

    # Proxy inverso transparente hacia el backend Java (Spring Boot)
    # ^~ hace que este prefijo gane sobre la location regex de estáticos;
    # de lo contrario /api/ quedaría tapado y se respondería desde la raíz de Nginx.
    location ^~ /api/ {
        # El bloqueo de archivos ocultos se repite aquí: ^~ omite la regex global.
        location ~ /\. {
            deny all;
        }
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Bloqueo de archivos ocultos (.git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Los estáticos deben fallar de forma explícita. Sin este bloque, un archivo
    # faltante caía en el fallback de la SPA de "location /" y se enmascaraba
    # como una respuesta 200 que llevaba index.html, lo que aparece como un
    # confuso "Unexpected token '<'" en lugar de un 404 limpio. Esta location
    # regex se evalúa antes que las locations de prefijo simples, y es justamente
    # por eso que /api/ de arriba se declara con ^~ para seguir ganando.
    # El HTML queda excluido a propósito: los documentos deben seguir funcionando.
    location ~* \.(js|css|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot|map)$ {
        try_files $uri =404;
        # Los nombres de archivo no llevan hash de contenido, así que no se pueden
        # cachear indefinidamente: al publicar, un cliente que no revalide sigue
        # ejecutando el módulo viejo. "no-cache" obliga a revalidar con el ETag en
        # cada carga, y la respuesta normal es un 304 vacío, no una descarga.
        add_header Cache-Control "no-cache" always;
    }
}
