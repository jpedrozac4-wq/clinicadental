# ============================================================================
# SISTEMA DE GESTION PARA CONSULTORIO DENTAL
# ORQUESTACION DOCKER COMPOSE (docker-compose.yml)
# Servicios: PostgreSQL 16 + Backend Java (Spring Boot) + Nginx (SPA clinica)
# Base de datos inicializada desde schema.sql y seed_data.sql
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # 1. BASE DE DATOS TRANSACCIONAL ACID: PostgreSQL 16
  # --------------------------------------------------------------------------
  database:
    image: postgres:16-alpine
    container_name: clinica-dental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinica_dental
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      # Persistencia inmutable de datos en volumen nombrado
      - postgres_data:/var/lib/postgresql/data
      # Scripts DDL y datos semilla ejecutados automáticamente al inicializar
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinica_dental"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinica_dental_net

  # --------------------------------------------------------------------------
  # 2. BACKEND TRANSACCIONAL: Java (Spring Boot - Package by Feature)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinica-dental-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: >-
        jdbc:postgresql://database:5432/clinica_dental
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
      SERVER_PORT: 8080
      CLINICA_JWT_SECRET: >-
        ${CLINICA_JWT_SECRET:-clinica-dental-dev-secret-key-32bytes}
      CLINICA_JWT_EXPIRATION_SECONDS: ${CLINICA_JWT_EXPIRATION_SECONDS:-28800}
    ports:
      - "8085:8080"
    networks:
      - clinica_dental_net

  # --------------------------------------------------------------------------
  # 3. FRONTEND VAINILLA Y REVERSE PROXY: Nginx Alpine
  # --------------------------------------------------------------------------
  frontend:
    image: nginx:alpine
    container_name: clinica-dental-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - clinica_dental_net

# ----------------------------------------------------------------------------
# VOLUMENES PERSISTENTES Y RED AISLADA
# ----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: clinica_dental_pgdata

networks:
  clinica_dental_net:
    name: clinica_dental_net
    driver: bridge
