# ============================================================================
# SISTEMA INTEGRAL ERP Y E-COMMERCE B2C FUNCIONAL - INDUSTRIA DEL CALZADO
# ORQUESTACION DOCKER COMPOSE (docker-compose.yml)
# Servicios: PostgreSQL 16 + Backend Java + Nginx Frontend Vainilla
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # 1. BASE DE DATOS TRANSACCIONAL ACID: PostgreSQL 16
  # --------------------------------------------------------------------------
  database:
    image: postgres:16-alpine
    container_name: erp-calzado-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_ecommerce_calzado
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      # Persistencia inmutable de datos en volumen nombrado
      - postgres_data:/var/lib/postgresql/data
      # Scripts DDL y datos semilla ejecutados automáticamente al inicializar
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_ecommerce_calzado"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  # --------------------------------------------------------------------------
  # 2. BACKEND TRANSACCIONAL: Java (Spring Boot - Package by Feature)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-calzado-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: >-
        jdbc:postgresql://database:5432/erp_ecommerce_calzado
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
      SERVER_PORT: 8080
      ERP_JWT_SECRET: ${ERP_JWT_SECRET:-erp-calzado-dev-secret-key-32bytes}
      ERP_JWT_EXPIRATION_SECONDS: ${ERP_JWT_EXPIRATION_SECONDS:-28800}
    ports:
      - "8085:8080"
    volumes:
      # Las fotos de variante viven en storage/calzado y la base
      # persiste sus urls. Sin este volumen quedarian en la capa
      # escribible del contenedor: recrearlo las borraria y dejaria
      # esas urls apuntando a archivos inexistentes.
      - backend_storage:/app/storage
    networks:
      - erp-network

  # --------------------------------------------------------------------------
  # 3. FRONTEND VAINILLA Y REVERSE PROXY: Nginx Alpine
  # --------------------------------------------------------------------------
  frontend:
    image: nginx:alpine
    container_name: erp-calzado-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - erp-network

# ----------------------------------------------------------------------------
# VOLUMENES PERSISTENTES Y RED AISLADA
# ----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: erp_calzado_pgdata
  backend_storage:
    name: erp_calzado_storage

networks:
  erp-network:
    name: erp_calzado_net
    driver: bridge
