spring:
  application:
    name: clinica-dental
  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: >-
      ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/clinica_dental}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

clinica:
  security:
    jwt:
      # Override in production. Must be at least 32 bytes for HS256.
      secret: ${CLINICA_JWT_SECRET:clinica-dental-dev-secret-32bytes-min-ok}
      # 8 hours, aligned with a full back-office shift.
      expiration-seconds: ${CLINICA_JWT_EXPIRATION_SECONDS:28800}
      issuer: clinica-dental
    cors:
      # Lista separada por comas. El puerto 80 sirve el frontend via Nginx.
      allowed-origins: ${CLINICA_CORS:http://localhost,http://127.0.0.1}

logging:
  level:
    root: INFO
    com.clinica.dental: DEBUG
    org.springframework.security: INFO
